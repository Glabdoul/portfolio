<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teasers | Lucas Matthes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    colors: {
                        'bg-main': '#121212',
                        'bg-card': '#18181b', 
                        'text-main': '#EDEDED',
                        'text-muted': '#A1A1AA',
                        'primary-orange': '#FB923C',
                        'primary-green': '#34D399',
                        'primary-blue': '#60A5FA',
                        'primary-purple': '#C084FC',
                        'primary-pink': '#FB7185',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #121212; color: #EDEDED; font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .placeholder-container {
            aspect-ratio: 9 / 16;
            background-color: #18181b;
            border: 2px dashed #333;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            text-align: center;
            padding: 20px;
        }
        
        .placeholder-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        /* Conteneur pour vidéos portrait */
        .portrait-video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            background-color: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .portrait-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .portrait-video-container .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .portrait-video-container:hover .play-overlay {
            opacity: 1;
        }
        
        .portrait-video-container .play-overlay svg {
            width: 24px;
            height: 24px;
            fill: #121212;
            margin-left: 3px;
        }
    </style>
</head>
<body class="antialiased">

    <nav class="max-w-6xl mx-auto px-6 py-10">
        <a href="../index.html" class="text-white/50 hover:text-white transition-colors flex items-center gap-2 text-sm font-medium w-max">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
            </svg>
            Retour au portfolio
        </a>
    </nav>

    <main class="max-w-5xl mx-auto px-6 pb-24 fade-in">
        
        <header class="mb-16 text-center">
            <span class="text-primary-purple font-bold tracking-widest uppercase text-xs mb-2 block">Alternance - Azur Massages</span>
            <h1 class="text-4xl md:text-5xl font-bold mb-8">Teasers</h1>
        </header>

        <!-- 2 vidéos en haut côte à côte -->
        <section class="mb-16">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl mx-auto">
                <!-- Teaser Suédois -->
                <div class="portrait-video-container shadow-2xl">
                    <video controls poster="../Assets/Teaser suedois.jpg">
                        <source src="../Assets/Teaser Suédois.mp4" type="video/mp4">
                        Votre navigateur ne supporte pas la lecture de vidéos.
                    </video>
                    <div class="play-overlay">
                        <svg viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </div>
                </div>
                
                <!-- Teaser Étirements -->
                <div class="portrait-video-container shadow-2xl">
                    <video controls poster="../Assets/Teaser Etirements.jpg">
                        <source src="../Assets/Teaser Etirements.mp4" type="video/mp4">
                        Votre navigateur ne supporte pas la lecture de vidéos.
                    </video>
                    <div class="play-overlay">
                        <svg viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </section>

        <!-- Explications -->
        <section class="mb-16 max-w-4xl mx-auto">
            <p class="text-zinc-400 leading-relaxed text-lg">
                Teasers pour promouvoir les modules des formations proposés par l'école Azur Massages.
            </p>
        </section>

        <!-- Détails techniques -->
        <section class="grid grid-cols-2 md:grid-cols-4 gap-8 mb-20 border-y border-white/10 py-8 max-w-4xl mx-auto">
            <div>
                <h3 class="text-white/40 uppercase text-[10px] font-bold tracking-widest mb-1">Rôle</h3>
                <p class="text-base font-medium">Tournage, Montage</p>
            </div>
            <div>
                <h3 class="text-white/40 uppercase text-[10px] font-bold tracking-widest mb-1">Type</h3>
                <p class="text-base font-medium">Teasers promotionnels</p>
            </div>
            <div>
                <h3 class="text-white/40 uppercase text-[10px] font-bold tracking-widest mb-1">Destination</h3>
                <p class="text-base font-medium">Réseaux sociaux</p>
            </div>
            <div>
                <h3 class="text-white/40 uppercase text-[10px] font-bold tracking-widest mb-1">Cible</h3>
                <p class="text-base font-medium">Futurs étudiants</p>
            </div>
        </section>

        <section class="border-t border-white/10 pt-16 text-center">
            <h3 class="text-2xl font-bold mb-6">Voir d'autres projets</h3>
            <div class="flex justify-center gap-4">
                <a href="../index.html" class="px-8 py-3 bg-white/5 hover:bg-white text-white hover:text-black border border-white/10 rounded-full transition-all font-medium text-sm">
                    Retour à l'accueil
                </a>
            </div>
        </section>

    </main>

</body>
</html>
